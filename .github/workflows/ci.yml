name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Upgrade npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm install-scripts approve better-sqlite3 esbuild --no-allow-scripts-pin
          npm rebuild better-sqlite3 esbuild

      - name: Check Formatting
        run: git diff --check

      - name: Enforce container-only publishing policy
        run: npm run check:release-policy

      - name: Svelte and TypeScript Check
        run: npm run check

      - name: Run Unit and Integration Tests
        run: npm run test:unit -- --run

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Compile Production Build
        run: npm run build

      - name: Start production preview for Lighthouse
        env:
          DATABASE_PATH: /tmp/koaladata-ci-preview.db
          DATA_DIRECTORY: /tmp/koaladata-ci-data
          KOALADATA_ADMIN_USERNAME: admin
          KOALADATA_ADMIN_PASSWORD: ci-preview-password-is-not-used-outside-actions
          ORIGIN: http://127.0.0.1:4173
        run: |
          mkdir -p "$DATA_DIRECTORY"
          npm run preview -- --host 127.0.0.1 > /tmp/koaladata-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/api/health && exit 0
            sleep 1
          done
          cat /tmp/koaladata-preview.log
          exit 1

      - name: Enforce Lighthouse quality budget
        run: |
          mkdir -p test-results
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.0 http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path="test-results/lighthouse-${run}.json"
          done
          node scripts/check-lighthouse.mjs test-results/lighthouse-*.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: koaladata:ci-${{ github.sha }}
          cache-from: type=gha,scope=koaladata-container
          cache-to: type=gha,mode=max,scope=koaladata-container

      - name: Verify fresh and upgraded container startup
        env:
          KOALADATA_TEST_IMAGE: koaladata:ci-${{ github.sha }}
        run: node scripts/test-container-startup.mjs
